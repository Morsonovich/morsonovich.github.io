<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Charlie Morningstar — Party Mode (Hazbin Hotel)</title>
  <link rel="icon" type="image/jpeg" href="media/anim_heart.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e0d1b 0%, #0c0810 70%, #050307 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .main-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 440px;
      width: 100%;
    }

    /* Header Title */
    .header-bar {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff3b68, #ffbd38, #ff3b68);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      color: #b09eb3;
      font-weight: 500;
    }

    /* Version Switcher Tabs */
    .tab-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 4px;
      width: 100%;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #b09eb3;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff2d55, #ff5722);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255, 45, 85, 0.4);
    }

    .tab-btn:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* 9:16 Vertical Video Player */
    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 45, 85, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    video.clean-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* Tap to play overlay */
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
      z-index: 5;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2d55, #ff6b3d);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(255, 45, 85, 0.6);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-card:hover .play-circle {
      transform: scale(1.08);
    }

    .play-circle svg {
      fill: #fff;
      width: 32px;
      height: 32px;
      margin-left: 4px;
    }

    .play-txt {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* Badges list */
    .badge-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #dfcedf;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge.highlight {
      background: rgba(255, 45, 85, 0.15);
      border-color: rgba(255, 45, 85, 0.35);
      color: #ff6e8a;
    }

    /* Controls & download button */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }

    .btn-download {
      background: linear-gradient(135deg, #ff2d55, #ff5722);
      color: #fff;
      flex: 1;
      box-shadow: 0 6px 20px rgba(255, 45, 85, 0.35);
    }

    .btn-download:hover {
      background: linear-gradient(135deg, #ff476d, #ff6b3d);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 45, 85, 0.5);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 18px;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="main-wrap">

    <div class="header-bar">
      <div class="title">Charlie Party Mode</div>
      <div class="subtitle">Hazbin Hotel • Hardtekk Club Dance Loop</div>
    </div>

    <!-- Toggle between Animated Meme Edition & Full 2D Vivziepop Cuts -->
    <div class="tab-switcher">
      <button id="btnAnim" class="tab-btn active" onclick="switchMode('anim')">
        ✨ Живая анимация (Meme)
      </button>
      <button id="btnHyper" class="tab-btn" onclick="switchMode('hyper')">
        🔥 2D Vivziepop Cuts
      </button>
    </div>
    
    <div class="video-card">
      <video id="charlieVideo" class="clean-player" loop playsinline preload="auto" poster="media/charlie_poster.jpg">
        <source id="videoSrc" src="charlie_party_mode.mp4" type="video/mp4">
      </video>

      <div id="playOverlay" class="play-overlay">
        <div class="play-circle">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="play-txt">Нажмите для воспроизведения</div>
      </div>
    </div>

    <div id="badgeBar" class="badge-bar">
      <span class="badge highlight">⚡ 60 FPS Fluid</span>
      <span class="badge">1080×1920 (9:16)</span>
      <span class="badge">🫶 Ручки-Сердечко</span>
      <span class="badge">👄 Липсинк & Пение</span>
      <span class="badge">😉 Моргание & Взгляды</span>
      <span class="badge">🚨 Прожекторы & Strobe</span>
    </div>

    <div class="controls-row">
      <a id="downloadLink" href="charlie_party_mode.mp4" download="Charlie_Party_Mode_Animated.mp4" class="btn btn-download">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
        Скачать MP4
      </a>

      <a href="index.html" class="btn btn-back">
        ← Меню
      </a>
    </div>

  </div>

  <script>
    const video = document.getElementById('charlieVideo');
    const overlay = document.getElementById('playOverlay');
    const downloadLink = document.getElementById('downloadLink');
    const btnAnim = document.getElementById('btnAnim');
    const btnHyper = document.getElementById('btnHyper');

    let currentMode = 'anim';

    const MODES = {
      anim: {
        src: 'charlie_party_mode.mp4',
        downloadName: 'Charlie_Party_Mode_Animated.mp4',
        poster: 'media/charlie_poster.jpg'
      },
      hyper: {
        src: 'media/charlie_party_hyper.mp4',
        downloadName: 'Charlie_Party_Mode_Vivziepop.mp4',
        poster: 'media/anim_heart.jpg'
      }
    };

    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      const wasPlaying = !video.paused;
      const curTime = video.currentTime;

      if (mode === 'anim') {
        btnAnim.classList.add('active');
        btnHyper.classList.remove('active');
      } else {
        btnHyper.classList.add('active');
        btnAnim.classList.remove('active');
      }

      video.src = MODES[mode].src;
      video.poster = MODES[mode].poster;
      downloadLink.href = MODES[mode].src;
      downloadLink.download = MODES[mode].downloadName;
      video.load();
      video.currentTime = curTime;

      if (wasPlaying) {
        video.play().then(() => {
          overlay.classList.add('hidden');
        }).catch(() => {});
      } else {
        overlay.classList.remove('hidden');
      }
    }

    function togglePlay() {
      if (video.paused) {
        video.play().then(() => {
          overlay.classList.add('hidden');
        }).catch(err => {
          console.warn("Autoplay blocked", err);
        });
      } else {
        video.pause();
        overlay.classList.remove('hidden');
      }
    }

    overlay.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    video.addEventListener('ended', () => {
      overlay.classList.remove('hidden');
    });
  </script>
</body>
</html>
