<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="dynamicTitle">@Morsonovich</title>
  
  <!-- Favicon using GitHub avatar -->
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/242276026?v=4">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Cursor effects -->
  <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= ФОН (CANVAS ЧАСТИЦЫ + НЕОНОВЫЙ ГРАДИЕНТ) ================= -->
  <canvas id="cyberCanvas"></canvas>
  <div class="cyber-glow-bg"></div>
  <div class="cyber-grid"></div>

  <!-- Фоновая музыка (CDN стрим с fallback) -->
  <audio id="bgAudio" loop preload="auto">
    <source src="media/audio/background.mp3" type="audio/mpeg">
    <source src="https://assets.mixkit.co/music/preview/mixkit-chill-bro-494.mp3" type="audio/mpeg">
  </audio>

  <!-- ================= ВЕРХНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ ================= -->
  <header class="top-nav">
    <!-- Статус -->
    <div class="online-pill">
      <span class="pulse-dot"></span>
      <span>ONLINE</span>
    </div>

    <div class="top-actions">
      <!-- Кнопка Музыки -->
      <button class="nav-btn" id="musicToggleBtn" title="Включить / Выключить музыку" aria-label="Музыка">
        <svg id="musicIconPlay" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <span id="musicStatusText">Музыка: Выкл</span>
      </button>

      <!-- Кнопка На весь экран -->
      <button class="nav-btn" id="fullscreenToggleBtn" title="Перейти в полноэкранный режим" aria-label="На весь экран">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span>На весь экран</span>
      </button>
    </div>
  </header>

  <!-- ================= ГЛАВНАЯ КАРТОЧКА (С ВЫХОДОМ НА ВСЕ СОЦСЕТИ) ================= -->
  <main class="main-fullscreen">
    <div class="card-perspective">
      <div class="profile-card" id="tiltCard">
        
        <!-- Световой блик (glare) -->
        <div class="card-glare" id="cardGlare"></div>

        <!-- Шапка-баннер -->
        <div class="card-banner">
          <div class="banner-gradient"></div>
          <div class="banner-tag">OFFICIAL PROFILE</div>
        </div>

        <!-- Контент профиля -->
        <div class="card-content">
          
          <!-- Аватарка (автоматически подтягивает с GitHub retrogradniy) -->
          <div class="avatar-container">
            <div class="avatar-neon-ring"></div>
            <img src="https://avatars.githubusercontent.com/u/242276026?v=4" alt="Morsonovich" class="avatar-img" id="userAvatar" onerror="this.src='https://github.com/retrogradniy.png'">
            <div class="status-badge" title="В сети"></div>
          </div>

          <!-- Имя и значок верификации -->
          <div class="user-heading">
            <h1 class="user-nickname">Morsonovich</h1>
            <span class="verified-icon" title="Verified Creator">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="#00f0ff">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </span>
          </div>

          <!-- Роли (динамическая печатная машинка) -->
          <div class="typing-container">
            <span id="roleText">Lead Java & Web Developer</span>
            <span class="blinking-cursor">|</span>
          </div>

          <!-- Бейджи специализаций -->
          <div class="badge-row">
            <span class="badge-item cyan">👑 Lead Dev</span>
            <span class="badge-item green">🛡️ MORSPVO</span>
            <span class="badge-item purple">⚡ HighLoad</span>
            <span class="badge-item blue">🎯 EZ Leader</span>
          </div>

          <!-- ================= КНОПКИ СОЦИАЛЬНЫХ СЕТЕЙ (КЛИКАБЕЛЬНЫЕ) ================= -->
          <div class="social-section">
            <div class="social-label">МОИ СОЦИАЛЬНЫЕ СЕТИ И РЕСУРСЫ</div>

            <div class="social-grid">
              
              <!-- 1. GITHUB (ПРЯМАЯ ССЫЛКА НА ВАШ ПРОФИЛЬ) -->
              <a href="https://github.com/retrogradniy" target="_blank" rel="noopener noreferrer" class="social-card-btn github" id="githubLink">
                <div class="social-card-icon">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                  </svg>
                </div>
                <div class="social-card-info">
                  <div class="social-name">GitHub</div>
                  <div class="social-handle">@retrogradniy</div>
                </div>
                <div class="social-arrow">&rarr;</div>
              </a>

              <!-- 2. TELEGRAM -->
              <a href="https://t.me/retrogradniy" target="_blank" rel="noopener noreferrer" class="social-card-btn telegram" id="tgLink">
                <div class="social-card-icon">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                  </svg>
                </div>
                <div class="social-card-info">
                  <div class="social-name">Telegram</div>
                  <div class="social-handle">Написать в ЛС</div>
                </div>
                <div class="social-arrow">&rarr;</div>
              </a>

              <!-- 3. DISCORD -->
              <a href="https://discord.com/users/retrogradniy" target="_blank" rel="noopener noreferrer" class="social-card-btn discord" id="discordLink">
                <div class="social-card-icon">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                  </svg>
                </div>
                <div class="social-card-info">
                  <div class="social-name">Discord</div>
                  <div class="social-handle">Профиль Discord</div>
                </div>
                <div class="social-arrow">&rarr;</div>
              </a>

              <!-- 4. STEAM -->
              <a href="https://steamcommunity.com" target="_blank" rel="noopener noreferrer" class="social-card-btn steam" id="steamLink">
                <div class="social-card-icon">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M12 2a10 10 0 0 0-10 9.94c0 4.7 3.25 8.65 7.64 9.72l1.45-3.61c-.55-.42-.92-1.07-.97-1.81l-3.23-.92a2.38 2.38 0 0 1-.22.01c-1.31 0-2.38-1.07-2.38-2.38s1.07-2.38 2.38-2.38c1.3 0 2.36 1.05 2.38 2.34l3.19.91c.47-.32 1.04-.51 1.66-.51 1.65 0 3 1.35 3 3s-1.35 3-3 3c-.48 0-.93-.12-1.33-.32l-1.46 3.65A10.01 10.01 0 0 0 22 12A10 10 0 0 0 12 2zm-4.33 9.95c0 .76-.62 1.38-1.38 1.38s-1.38-.62-1.38-1.38.62-1.38 1.38-1.38 1.38.62 1.38 1.38zm7.25 4.99a2.02 2.02 0 1 1 0-4.04 2.02 2.02 0 0 1 0 4.04z"/>
                  </svg>
                </div>
                <div class="social-card-info">
                  <div class="social-name">Steam</div>
                  <div class="social-handle">Steam Profile</div>
                </div>
                <div class="social-arrow">&rarr;</div>
              </a>

            </div>
          </div>

          <!-- Нижний счетчик просмотров -->
          <div class="footer-stats">
            <div class="counter-badge">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00f0ff" stroke-width="2">
                <ellipse cx="12" cy="12" rx="9" ry="5"/>
                <circle cx="12" cy="12" r="2.5" fill="#00f0ff"/>
              </svg>
              <span id="viewCountText">1,337</span>
              <span class="views-text">визитов</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
